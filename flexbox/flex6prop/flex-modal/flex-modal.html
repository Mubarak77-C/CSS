<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-Modal</title>
    <link rel="stylesheet" href="flex-modal.css">
</head>

<body>
    <!-- full section parent class where center modal box with white bg -->
    <div class="section">
        <!-- logo  left side circle  ! -->
        <div class="header">
            <div class="logo-left">!</div>
            <!-- right x close button cirlce x -->
            <div class="close">
                X
            </div>
        </div>

        <!-- bold text heading -->
        <div class="middle-content">
            <div class="title">Are you sure want to do that?</div>
            <!-- paragraph -->
            <div class="content">Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque sint ut id officia,
                aliquam
                molestiae, doloremque voluptatem consectetur adipisci qui iusto explicabo, quibusdam doloribus? Qui
                possimus
                ex accusamus! Eligendi, dicta!</div>

            <!-- bottom button 2 -->
            <div class="buttons-section">

                <div class="continue-btn">
                    <button>Continue</button>
                </div>

                <div class="cancel-btn">
                    <button>Cancel</button>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
