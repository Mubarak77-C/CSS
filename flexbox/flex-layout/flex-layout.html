<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex output</title>
    <link rel="stylesheet" href="flex-layout.css">
</head>

<body>
    <!-- header section -->
    <!-- 4button two left two right -->
    <div class="header-section">
        <div class="header-left">
            <div class="top-leftbtn">
                <button>
                    About
                </button>
                <button>
                    Store
                </button>
            </div>
        </div>

        <!-- right header -->
        <div class="header-right">
            <div class="top-rightbtn">
                <button>
                    Profile
                </button>
                <button>
                    Setting
                </button>
            </div>
        </div>




    </div>

    <!-- middle section with img title search bar two button below -->
    <div class="middle-section">
        <div class="logo">
            <img src="logo.png" alt="logo">
        </div>
        <div class="searchbar">
            <input type="search">
        </div>
        <div class="search-btn">
            <button>DO the things!</button>
            <button>Do other things!</button>
        </div>


    </div>



    <!-- footer section-->
    <!-- 2btn left and right -->
    <footer>
        <div class="footer-section">
            <div class="footer-left">
                <div class="bottom-leftbtn">
                    <button>
                        Advertising
                    </button>
                    <button>
                        Business
                    </button>
                </div>
            </div>

            <div class="footer-right">
                <div class="bottom-rightbtn">
                    <button>
                        Privacy
                    </button>
                    <button>
                        Terms
                    </button>
                </div>
            </div>


        </div>
    </footer>
</body>

</html>
